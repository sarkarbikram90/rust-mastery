name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build & Test All Member Projects
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Discover and test all crates
        run: |
          find members -name "Cargo.toml" | sort | while read -r manifest; do
            echo "::group::Testing $manifest"
            cargo test --verbose --manifest-path "$manifest"
            echo "::endgroup::"
          done
